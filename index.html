<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>hello, friend.</title>
<link rel="icon" href="mask.svg">
<style>
  :root { --bg: #000; --fg: #d6d6d6; --dim: #6b6b6b; --red: #e4141b; --green: #3dff7f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    min-height: 100vh; min-height: 100dvh;
    font: 15px/1.6 ui-monospace, Menlo, "SF Mono", "Roboto Mono", "Courier New", monospace;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  #out { white-space: pre-wrap; word-break: break-word; }
  .cmd { color: var(--fg); }
  .cmd::before { content: "$ "; color: var(--red); }
  .ok { color: var(--dim); }
  .ok b { color: var(--green); font-weight: normal; }
  .val { color: var(--fg); }
  .big { font-weight: 700; font-size: 26px; line-height: 1.3; color: #fff; }
  .red { color: var(--red); }
  .dim { color: var(--dim); }
  .cursor { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.2em; background: var(--fg); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #mask { display: block; width: 120px; margin: 36px 0 8px; opacity: 0; transition: opacity 2.5s ease; }
  #mask.on { opacity: 0.92; }
  #skip { position: fixed; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); font-size: 11px; color: var(--dim); }
  #skip.gone { display: none; }
</style>
</head>
<body>
<main>
  <div id="out"></div>
  <img id="mask" src="mask.svg" alt="">
</main>
<div id="skip">tap to skip</div>

<script>
  // Everything below runs on the visitor's phone only. Nothing is sent anywhere.
  const ua = navigator.userAgent;
  const device =
    /iPhone/.test(ua) ? 'iPhone' :
    /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad' :
    /Android/.test(ua) ? 'Android' :
    /Mac/.test(ua) ? 'Mac' :
    /Windows/.test(ua) ? 'Windows' : 'unknown';
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown').toLowerCase();
  const screenSize = screen.width + 'x' + screen.height;

  // [class, text, pause after line in ms]
  const script = [
    ['cmd', './connect --target=you', 500],
    ['dim', 'establishing connection...', 900],
    ['ok', 'device: ' + device, 120],
    ['ok', 'screen: ' + screenSize, 120],
    ['ok', 'local time: ' + time, 120],
    ['ok', 'location: ' + tz, 900],
    ['', '', 0],
    ['big', 'hello, friend.', 1100],
    ['', '', 0],
    ['', 'you just scanned a code', 0],
    ['', 'a stranger in a hoodie handed you.', 0],
    ['', 'on halloween.', 900],
    ['', '', 0],
    ['', 'bold move.', 1000],
    ['', '', 0],
    ['', "relax. we didn't take anything.", 500],
    ['red', 'this time.', 1200],
    ['', '', 0],
    ['', 'we were never here.', 300],
    ['dim', '- fsociety', 0],
  ];

  const out = document.getElementById('out');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  const charDelay = 22;
  let skipped = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const wait = ms => new Promise(r => setTimeout(r, skipped ? 0 : ms));

  function lineEl(cls) {
    const el = document.createElement('div');
    if (cls) el.className = cls;
    return el;
  }

  async function type(el, text) {
    if (el.className === 'ok') {
      // "[ok] key: value" with a green ok and bright value.
      const i = text.indexOf(': ') + 2;
      el.innerHTML = '[<b>ok</b>] ';
      const key = document.createTextNode('');
      const val = document.createElement('span');
      val.className = 'val';
      el.append(key, val);
      for (let n = 0; n < text.length; n++) {
        if (n < i) key.data += text[n]; else val.textContent += text[n];
        await wait(charDelay);
      }
      return;
    }
    for (const ch of text) {
      el.textContent += ch;
      await wait(charDelay);
    }
  }

  async function run() {
    for (const [cls, text, pause] of script) {
      const el = lineEl(cls);
      out.appendChild(el);
      el.after(cursor);
      if (text) await type(el, text); else el.textContent = ' ';
      await wait(pause);
    }
    out.appendChild(cursor);
    document.getElementById('mask').classList.add('on');
    document.getElementById('skip').classList.add('gone');
  }

  addEventListener('pointerdown', () => { skipped = true; }, { once: true });
  run();
</script>
</body>
</html>
